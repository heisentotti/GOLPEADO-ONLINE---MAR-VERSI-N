<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Golpeado Online</title>
<style>
:root{--bg:#0b1714;--table:#17483d;--panel:#10241f;--gold:#d6b45f;--text:#f5f0e5;--muted:#a9bbb5;--card:#fbf8ef;--ink:#17201d;--red:#b83a43}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#1d5b4c,var(--bg) 60%);color:var(--text);font:15px system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh}.wrap{max-width:1200px;margin:auto;padding:22px}.panel{background:rgba(16,36,31,.96);border:1px solid rgba(214,180,95,.35);border-radius:16px;padding:18px;box-shadow:0 14px 45px #0005}.top{display:flex;justify-content:space-between;gap:12px;align-items:center}.grid{display:grid;grid-template-columns:280px 1fr;gap:16px}.players{display:grid;gap:10px}.player{padding:10px;border:1px solid #ffffff16;border-radius:10px}.player.me{border-color:var(--gold)}.board{min-height:620px;background:linear-gradient(#17483d,#10382f);border-radius:18px;padding:18px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.hand{display:flex;flex-wrap:wrap;gap:8px}.card{width:68px;height:94px;background:var(--card);color:var(--ink);border-radius:9px;border:2px solid #d9d2c2;display:flex;flex-direction:column;justify-content:space-between;padding:7px;font-weight:800;cursor:pointer;user-select:none}.card.red{color:var(--red)}.card.sel{border-color:var(--gold);box-shadow:0 0 0 3px #d6b45f55;transform:translateY(-5px)}button,input{font:inherit}button{background:#1c4d42;color:var(--text);border:1px solid #ffffff20;border-radius:9px;padding:10px 13px;cursor:pointer}button.primary{background:var(--gold);color:#17201d;font-weight:800}button:disabled{opacity:.4;cursor:not-allowed}input{width:100%;padding:10px;border-radius:9px;border:1px solid #ffffff25;background:#091512;color:var(--text);margin:5px 0 9px}.status{color:var(--muted);min-height:24px}.section{margin-top:16px}.center{text-align:center}.hidden{display:none}.discard{display:inline-flex;vertical-align:middle}.sort-active{border-color:var(--gold);box-shadow:0 0 0 2px #d6b45f33}.error{color:#ff9a9a}.success{color:#9ce2b5}.title{font-size:28px;font-weight:900;color:var(--gold)}small{color:var(--muted)}@media(max-width:850px){.grid{grid-template-columns:1fr}.board{min-height:0}}
.chatBox{height:360px;overflow:auto;display:grid;align-content:start;gap:8px;margin:10px 0}.chatMsg{padding:7px 9px;border:1px solid #28554a;border-radius:8px;background:#15332b}.chatInput{display:flex;gap:6px}.chatInput input{min-width:0;margin:0}.stats{font-size:12px;color:var(--muted)}
@media(max-width:1050px){.grid{grid-template-columns:210px minmax(0,1fr)}.chatPanel{grid-column:1/-1}}@media(max-width:700px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body><div class="wrap">
<div id="menu" class="panel"><div class="title">GOLPEADO</div><p><small>Juega online desde el navegador.</small></p>
<label>Tu nombre</label><input id="name" placeholder="Jugador" maxlength="24">
<div class="actions"><button class="primary" onclick="createRoom()">Crear sala</button></div>
<hr><label>Código de sala</label><input id="roomCode" placeholder="ABC123" maxlength="6">
<div class="actions"><button onclick="joinRoom()">Entrar a sala</button></div><div id="menuMsg" class="status"></div></div>
<div id="lobby" class="panel hidden"><div class="top"><div><div class="title">Sala <span id="lobbyCode"></span></div><div id="lobbyStatus" class="status"></div></div><button onclick="abandon()">Salir</button></div><div id="lobbyPlayers" class="section"></div><div id="startControls" class="actions"></div></div>
<div id="game" class="hidden"><div class="top panel"><div><div class="title">GOLPEADO</div><div id="turnStatus" class="status"></div></div><button onclick="abandon()">Abandonar</button></div><div class="grid section"><aside class="panel"><h3>Jugadores</h3><div id="players" class="players"></div></aside><main class="board panel"><div class="top"><div><b>Mazo</b> <span id="deckCount"></span></div><div><b>Último descarte</b> <span id="discard"></span></div></div><div id="message" class="status section"></div><div id="actions" class="actions"></div><div class="top"><h3 style="margin:0">Tu mano</h3><button id="sortBtn" onclick="toggleAutoSort()">↕ Ordenar</button></div><div id="hand" class="hand"></div></main><aside class="panel chatPanel"><div class="top"><h3 style="margin:0">Chat</h3><span id="chatCount" class="stats"></span></div><div id="chat" class="chatBox"></div><div class="chatInput"><input id="chatInput" maxlength="300" placeholder="Escribe un mensaje..."><button onclick="sendChat()">Enviar</button></div><div id="revenge" class="section"></div></aside></div></div>
</div>
<script>
let room=null, me=null, token=null, ws=null, state=null, selected=new Set(), actionSeq=0;
let autoSort=true;
const $=id=>document.getElementById(id); const msg=(t,c='')=>{ $('menuMsg').textContent=t; $('menuMsg').className='status '+c };
async function post(url,body){const r=await fetch(url,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.detail||d.message||'Error');return d}
async function createRoom(){try{const d=await post('/rooms',{name:$('name').value||'Jugador'});save(d);showLobby();}catch(e){msg(e.message,'error')}}
async function joinRoom(){try{const d=await post('/rooms/'+$('roomCode').value.trim().toUpperCase()+'/join',{name:$('name').value||'Jugador'});save(d);showLobby();}catch(e){msg(e.message,'error')}}
function save(d){room=d.room_code;me=d.player_id;token=d.reconnect_token;history.replaceState({},'',`/?room=${room}`);connect()}
function connect(){ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws/'+room);ws.onopen=()=>ws.send(JSON.stringify({type:'hello',player_id:me,reconnect_token:token}));ws.onmessage=e=>{const m=JSON.parse(e.data);if(m.type==='state'||m.type==='action_ack'){render(m.state)}else if(m.type==='error')setStatus(m.message,'error')};ws.onclose=()=>setStatus('Conexión perdida. Recarga para reconectar.','error')}
function send(action,payload={}){if(!ws||ws.readyState!==1)return;ws.send(JSON.stringify({type:'action',action_id:`${Date.now()}-${++actionSeq}`,action,payload}))}
async function start(){try{await post('/rooms/'+room+'/start',{player_id:me,bot_count:0,bot_difficulty:'normal'})}catch(e){setStatus(e.message,'error')}}
function showLobby(){$('menu').classList.add('hidden');$('lobby').classList.remove('hidden');$('lobbyCode').textContent=room;}
function setStatus(t,c=''){$('message').textContent=t;$('message').className='status '+c;$('lobbyStatus').textContent=t}
function render(s){state=s;if(s.game_state){$('lobby').classList.add('hidden');$('game').classList.remove('hidden');renderGame()}else{showLobby();renderLobby()}}
function renderLobby(){const ps=state?.players||[];$('lobbyPlayers').innerHTML=ps.map(p=>`<div class="player ${p.id===me?'me':''}"><b>${esc(p.name)}</b> ${p.id===me?'(tú)':''}</div>`).join('');$('startControls').innerHTML=ps.length>=2&&ps[0]?.id===me?'<button class="primary" onclick="start()">Iniciar partida</button>':`<small>${ps.length}/4 jugadores. Comparte el código <b>${room}</b>.</small>`}
function renderGame(){
 const ps=state.players||[];
 $('turnStatus').textContent=state.game_state==='WON'
   ? `Partida terminada · ganó ${state.winner?.reason||''}`
   : (state.current_player_id===me?'Es tu turno.':'Turno de otro jugador.');
 $('deckCount').textContent=state.deck_count;
 $('discard').innerHTML=cardHtml(state.last_discard,true);
 $('players').innerHTML=ps.map(p=>{
   const st=state.stats?.[p.id]||{wins:0,losses:0};
   return `<div class="player ${p.id===me?'me':''}"><b>${esc(p.name)}</b><br><small>${p.active?'Activo':'Fuera'} · ${p.card_count} cartas · ${p.connected?'Conectado':'Desconectado'}</small><br><span class="stats">🏆 ${st.wins} · ❌ ${st.losses}</span>${p.lowered_group?`<br><small>Grupo: ${p.lowered_group.cards.map(c=>c.rank+c.suit).join(' ')}</small>`:''}</div>`;
 }).join('');
 const mine=ps.find(p=>p.id===me);
 const hand=autoSort?sortHand(mine?.hand||[]):(mine?.hand||[]);
 $('hand').innerHTML=hand.map(c=>cardHtml(c,false)).join('');
 $('sortBtn').className=autoSort?'sort-active':'';
 $('sortBtn').textContent=autoSort?'↕ Orden automático':'↕ Ordenar';
 $('actions').innerHTML='';
 if(state.current_player_id===me&&state.game_state==='playing'){
   if(state.phase==='draw') $('actions').innerHTML='<button class="primary" onclick="send(\'draw\')">Robar del mazo</button>'+(state.last_discard?'<button onclick="takeDiscard()">Recoger descarte</button>':'');
   if(state.phase==='action'||state.phase==='discard'){
     if(state.phase==='action'&&mine?.lowered_group===null) $('actions').innerHTML+='<button onclick="lower()">Bajar grupo seleccionado</button>';
     $('actions').innerHTML+='<button class="primary" onclick="discard()">Descartar seleccionada</button>';
   }
 }
 const chat=state.chat||[];
 $('chat').innerHTML=chat.map(m=>`<div class="chatMsg"><b>${esc(m.name)}</b><br>${esc(m.text)}</div>`).join('');
 $('chatCount').textContent=chat.length?`${chat.length} mensajes`:'';
 $('chat').scrollTop=$('chat').scrollHeight;
 const active=ps.filter(p=>p.active);
 if(state.game_state==='won'){
   const voted=(state.revenge_votes||[]).includes(me);
   $('revenge').innerHTML=`<div class="status success"><b>Revancha</b><br>${(state.revenge_votes||[]).length}/${active.length} aceptaron.</div><button onclick="requestRevenge()" ${voted?'disabled':''}>${voted?'✓ Esperando a los demás':'🔄 Aceptar revancha'}</button>`;
 } else $('revenge').innerHTML='';
}
function rankValue(rank){
  const r=String(rank||'').toUpperCase();
  if(r==='A'||r==='AS') return 1;
  if(r==='J'||r==='JACK') return 11;
  if(r==='Q'||r==='QUEEN') return 12;
  if(r==='K'||r==='KING') return 13;
  const n=parseInt(r,10);
  return Number.isFinite(n)?n:99;
}
function suitKey(c){return String(c?.suit||'');}
function groupKey(c){return String(c?.rank||'').toUpperCase();}
function cloneSorted(a,cmp){return [...a].sort(cmp);}
function sameRankGroups(cards){
  const by=new Map();
  for(const c of cards){const k=groupKey(c);if(!by.has(k))by.set(k,[]);by.get(k).push(c);}
  return [...by.values()]
    .filter(g=>g.length>=3)
    .sort((a,b)=>b.length-a.length)
    .map(g=>g.slice(0,4));
}
function sequenceGroups(cards){
  const bySuit=new Map();
  for(const c of cards){const s=suitKey(c);if(!bySuit.has(s))bySuit.set(s,[]);bySuit.get(s).push(c);}
  const out=[];
  for(const arr of bySuit.values()){
    const normal=cloneSorted(arr,(a,b)=>rankValue(a.rank)-rankValue(b.rank));
    const variants=[normal];
    // Ace may act as 14 for J-Q-K-A.
    const ace=normal.find(c=>String(c.rank).toUpperCase()==='A');
    if(ace && !normal.some(c=>rankValue(c.rank)===14)){
      variants.push(cloneSorted(normal.map(c=>c===ace?{...c,__rank14:true}:c),
        (a,b)=>(a.__rank14?14:rankValue(a.rank))-(b.__rank14?14:rankValue(b.rank))));
    }
    for(const v of variants){
      let run=[];
      for(let i=0;i<v.length;i++){
        if(i===0){run=[v[i]];continue;}
        const prev= v[i-1].__rank14?14:rankValue(v[i-1].rank);
        const cur = v[i].__rank14?14:rankValue(v[i].rank);
        if(cur===prev+1) run.push(v[i]);
        else {
          if(run.length>=3) out.push(run.slice());
          run=[v[i]];
        }
      }
      if(run.length>=3) out.push(run.slice());
    }
  }
  return out
    .sort((a,b)=>b.length-a.length)
    .map(g=>g.slice(0,4));
}
function sortHand(cards){
  const remaining=[...cards];
  const groups=[];
  // Prefer four-card groups, then three-card groups, while keeping groups disjoint.
  const candidates=[...sameRankGroups(remaining),...sequenceGroups(remaining)]
    .sort((a,b)=>b.length-a.length);
  for(const candidate of candidates){
    if(candidate.length<3) continue;
    if(candidate.every(c=>remaining.some(x=>x.id===c.id))){
      groups.push(candidate);
      const ids=new Set(candidate.map(c=>c.id));
      for(let i=remaining.length-1;i>=0;i--) if(ids.has(remaining[i].id)) remaining.splice(i,1);
    }
  }
  const flat=[];
  for(const g of groups){
    const isSeq=g.every((c,i)=>i===0 || (
      suitKey(c)===suitKey(g[0]) &&
      (g[i].__rank14?14:rankValue(g[i].rank)) === (g[i-1].__rank14?14:rankValue(g[i-1].rank))+1
    ));
    g.sort((a,b)=>rankValue(a.rank)-rankValue(b.rank));
    // Keep group types visually consistent; same-rank groups by suit, sequences by rank.
    if(!isSeq) g.sort((a,b)=>suitKey(a).localeCompare(suitKey(b)));
    flat.push(...g);
  }
  remaining.sort((a,b)=>{
    const sv=suitKey(a).localeCompare(suitKey(b));
    return sv || rankValue(a.rank)-rankValue(b.rank);
  });
  return [...flat,...remaining];
}
function toggleAutoSort(){
  autoSort=!autoSort;
  renderGame();
}
function cardHtml(c,small){if(!c)return '<span>—</span>';const red=['HEARTS','DIAMONDS'].includes(c.suit);return `<span class="card ${red?'red ':''}${selected.has(c.id)?'sel':''}" onclick="toggle('${c.id}')"><b>${esc(c.rank)}</b><span style="font-size:26px;text-align:center">${esc(c.symbol)}</span><b>${esc(c.rank)}</b></span>`}
function toggle(id){if(!state||state.current_player_id!==me)return;selected.has(id)?selected.delete(id):selected.add(id);renderGame()}
function ids(){return [...selected]}
function lower(){const a=ids();if(a.length<3||a.length>4)return setStatus('Selecciona 3 o 4 cartas.','error');send('lower_group',{card_ids:a});selected.clear()}
function takeDiscard(){const mine=state.players.find(p=>p.id===me);if(!state.last_discard)return;const a=ids();if(!a.includes(state.last_discard.id))a.push(state.last_discard.id);if(a.length<3||a.length>4)return setStatus('Selecciona 2 o 3 cartas de tu mano más el descarte.','error');send('take_discard',{card_ids:a});selected.clear()}
function discard(){const a=ids();if(a.length!==1)return setStatus('Selecciona exactamente una carta para descartar.','error');send('discard',{card_id:a[0]});selected.clear()}
function sendChat(){
 const input=$('chatInput'), text=input.value.trim();
 if(!text||!ws||ws.readyState!==1)return;
 ws.send(JSON.stringify({type:'chat',text}));
 input.value='';
}
$('chatInput')?.addEventListener('keydown',e=>{if(e.key==='Enter')sendChat()});
function requestRevenge(){
 if(ws&&ws.readyState===1)ws.send(JSON.stringify({type:'revenge'}));
}
function abandon(){if(ws&&ws.readyState===1)ws.send(JSON.stringify({type:'abandon'}));location.href='/'}
function esc(x){return String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
(async()=>{const q=new URLSearchParams(location.search);if(q.get('room')){$('roomCode').value=q.get('room').toUpperCase()}})();
</script></body></html>
