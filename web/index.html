<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Golpeado Online</title>
<style>
:root{--bg:#07130f;--table:#0b3b32;--table2:#082d27;--panel:#0d211c;--gold:#d9b45a;--gold2:#f0cf76;--text:#f7f3e8;--muted:#a8bbb4;--card:#fbf8ef;--ink:#151917;--red:#d51f2a;--red2:#ff3a43}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(circle at 50% -10%,#1d5b4c 0,#0d2b24 38%,var(--bg) 75%);color:var(--text);font:15px system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh}
.wrap{max-width:1400px;margin:auto;padding:18px}
.panel{background:rgba(9,31,25,.96);border:1px solid rgba(217,180,90,.35);border-radius:16px;padding:16px;box-shadow:0 14px 45px #0006}
.top{display:flex;justify-content:space-between;gap:12px;align-items:center}
.grid{display:grid;grid-template-columns:260px minmax(0,1fr) 285px;gap:14px}
.players{display:grid;gap:9px}
.player{padding:11px;border:1px solid #ffffff16;border-radius:12px;background:rgba(255,255,255,.018);transition:.2s ease}
.player.me{border-color:var(--gold)}
.player.active-turn{border:2px solid var(--red);box-shadow:0 0 16px rgba(213,31,42,.32),inset 0 0 20px rgba(213,31,42,.07);transform:translateX(2px)}
.player.active-turn .playerTurnTag{display:inline-block}
.playerTurnTag{display:none;background:var(--red);color:white;border-radius:999px;padding:2px 8px;font-size:10px;font-weight:900;margin-left:6px;letter-spacing:.3px}
.board{min-height:700px;background:linear-gradient(155deg,#155246,#0a332c 55%,#082b25);border-radius:18px;padding:18px;position:relative;overflow:hidden}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
button,input{font:inherit}
button{background:#16483e;color:var(--text);border:1px solid #ffffff20;border-radius:9px;padding:10px 13px;cursor:pointer;transition:transform .12s ease,box-shadow .12s ease,border-color .12s ease}
button:hover:not(:disabled){transform:translateY(-1px)}
button.primary{background:var(--gold);color:#17201d;font-weight:800}
button:disabled{opacity:.4;cursor:not-allowed}
input{width:100%;padding:10px;border-radius:9px;border:1px solid #ffffff25;background:#091512;color:var(--text);margin:5px 0 9px}
.status{color:var(--muted);min-height:24px;transition:opacity .2s ease}.status.status-hidden{opacity:0;visibility:hidden}.status.error{color:#ff9a9a}.status.success{color:#9ce2b5}
.section{margin-top:16px}.center{text-align:center}.hidden{display:none}
.discard{display:inline-flex;vertical-align:middle}
.sort-active{border-color:var(--gold);box-shadow:0 0 0 2px #d6b45f33}
.title{font-size:28px;font-weight:900;color:var(--gold)}
small{color:var(--muted)}
.lobbyCount{font-size:14px;font-weight:800;margin:8px 0}
.turn-banner{margin:14px auto 12px;max-width:640px;text-align:center;border:2px solid var(--gold);border-radius:16px;background:rgba(5,24,19,.86);padding:11px 18px;box-shadow:0 8px 28px #0004}
.turn-banner.active{border-color:var(--red);box-shadow:0 0 24px rgba(213,31,42,.3);animation:turnPulse 1.8s ease-in-out infinite}
.turn-label{display:inline-block;background:var(--red);color:#fff;border-radius:999px;padding:4px 12px;font-size:11px;font-weight:900;letter-spacing:.7px}
.turn-name{font-size:24px;font-weight:900;margin-top:4px}
.turn-name strong{color:var(--red2)}
.turn-banner.won{border-color:var(--gold2);box-shadow:0 0 30px rgba(217,180,90,.28)}
.turn-banner.won .turn-label{background:var(--gold);color:#17201d}
.turn-banner.won .turn-name strong{color:var(--gold2)}
.turn-sub{color:var(--muted);font-size:13px;margin-top:2px}
@keyframes turnPulse{0%,100%{box-shadow:0 0 18px rgba(213,31,42,.22)}50%{box-shadow:0 0 30px rgba(213,31,42,.48)}}

.hand{
  display:flex;
  flex-wrap:nowrap;
  gap:10px;
  align-items:flex-end;
  padding:8px 2px 18px;
  overflow-x:auto;
  overflow-y:hidden;
  min-width:0;
  scrollbar-width:thin;
}

.hand .card-image-wrap{
  width:70px;
  height:100px;
  flex:0 0 70px;
  transform:none;
}

.hand .card-image{
  width:100%;
  height:100%;
  display:block;
  object-fit:fill;
}

.card-image-wrap{
  position:relative;
  width:82px;
  height:116px;
  flex:0 0 82px;
  cursor:pointer;
  user-select:none;
  border-radius:11px;
  transition:transform .15s ease,box-shadow .15s ease;
}

.card-image{
  display:block;
  width:100%;
  height:100%;
  object-fit:contain;
  border-radius:11px;
  filter:drop-shadow(0 5px 7px rgba(0,0,0,.30));
  user-select:none;
  pointer-events:none;
}

.card-image-wrap:hover{
  transform:translateY(-5px);
}

.card-image-wrap.selected{
  transform:translateY(-10px);
  outline:3px solid #e53935;
  outline-offset:2px;
  border-radius:11px;
  filter:drop-shadow(0 0 8px rgba(229,57,53,.75));
  box-shadow:0 0 0 2px rgba(229,57,53,.35), 0 0 18px rgba(229,57,53,.55);
}

.card-image-wrap.selected .card-image{
  filter:
    drop-shadow(0 0 3px rgba(220,55,55,.98))
    drop-shadow(0 0 8px rgba(220,55,55,.75))
    drop-shadow(0 0 16px rgba(220,55,55,.45))
    drop-shadow(0 8px 8px rgba(0,0,0,.35));
}

.discard-slot{
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:132px;
  margin:8px 0 2px;
}

.discard-slot .card-image-wrap{
  cursor:default;
}

.card-caption{
  font-size:12px;
  color:var(--muted);
  text-align:center;
  margin-top:3px;
}



/* Distribución de mesa según cantidad de jugadores */












/* ================================
   MESA DE POKER - GOLPEADO
   ================================ */

.poker-table{
  position:relative;
  width:100%;
  min-height:650px;
  margin:18px 0;
  padding:22px;
  box-sizing:border-box;
}

.table-felt{
  position:relative;
  width:100%;
  min-height:610px;
  border-radius:42px;
  background:
    radial-gradient(ellipse at center,
      #145746 0%,
      #0d4639 48%,
      #08382f 100%);
  border:14px solid #4a3020;
  box-shadow:
    inset 0 0 0 3px rgba(217,180,90,.32),
    inset 0 0 45px rgba(0,0,0,.55),
    0 14px 30px rgba(0,0,0,.45);
  overflow:hidden;
}

/* Borde interior dorado */
.table-felt::before{
  content:"";
  position:absolute;
  inset:18px;
  border:2px solid rgba(217,180,90,.45);
  border-radius:30px;
  pointer-events:none;
}

/* Sombra interior de la mesa */
.table-felt::after{
  content:"";
  position:absolute;
  inset:30px;
  border-radius:25px;
  box-shadow:inset 0 0 45px rgba(0,0,0,.28);
  pointer-events:none;
}

/* ================================
   ZONAS DE LOS 4 JUGADORES
   ================================ */

/* ================================
   CENTRO DE LA MESA
   ================================ */

.table-center{
  position:absolute;
  z-index:10;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  display:flex;
  align-items:center;
  justify-content:center;
  gap:28px;
}

/* Mazo y descarte */
.table-pile{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  min-width:92px;
}

.pile-label{
  margin-bottom:8px;
  font-size:10px;
  font-weight:900;
  letter-spacing:1.5px;
  color:#f0cf76;
  text-shadow:0 2px 5px rgba(0,0,0,.7);
}

/* ================================
   MAZO
   ================================ */

.deck-visual{
  position:relative;
  width:70px;
  height:96px;
}

.deck-card{
  position:absolute;
  width:62px;
  height:88px;
  left:4px;
  top:4px;
  border-radius:8px;
  background:
    repeating-linear-gradient(
      45deg,
      #17231f 0px,
      #17231f 3px,
      #d51f2a 3px,
      #d51f2a 6px
    );
  border:2px solid #f7f3e8;
  box-shadow:0 5px 10px rgba(0,0,0,.45);
}

.deck-card:nth-child(1){
  transform:rotate(-5deg);
  left:0;
}

.deck-card:nth-child(2){
  transform:rotate(3deg);
  left:3px;
}

.deck-card.top-card{
  transform:rotate(0deg);
  left:4px;
  top:2px;
}

/* ================================
   DESCARTE
   ================================ */

.discard-slot{
  width:70px;
  height:96px;
  display:flex;
  align-items:center;
  justify-content:center;
  border:2px dashed rgba(240,207,118,.5);
  border-radius:9px;
  background:rgba(0,0,0,.14);
}

/* La carta real del descarte */
.discard-slot .card-image-wrap{
  width:62px;
  height:88px;
}

  }

  }

/* ============================================================
   ORDEN MANUAL DE CARTAS
   ============================================================ */

let manualOrderIds = [];
let draggedCardId = null;

function handFromState(){
  const mine = state?.players?.find(p=>p.id===me);
  return mine?.hand || [];
}

function syncManualOrder(hand){
  const ids = new Set(hand.map(c=>c.id));

  manualOrderIds = manualOrderIds.filter(id=>ids.has(id));

  for(const card of hand){
    if(!manualOrderIds.includes(card.id)){
      manualOrderIds.push(card.id);
    }
  }
}

function manualSortHand(hand){
  syncManualOrder(hand);

  const byId = new Map(hand.map(c=>[c.id,c]));

  return manualOrderIds
    .map(id=>byId.get(id))
    .filter(Boolean);
}

function enableManualDrag(){
  const handEl = $('hand');
  if(!handEl)return;

  handEl.querySelectorAll('.card-image-wrap').forEach(el=>{
    const id = el.dataset.cardId;
    if(!id)return;

    el.draggable = true;

    el.addEventListener('dragstart', e=>{
      draggedCardId = id;

      el.classList.add('dragging');

      if(e.dataTransfer){
        e.dataTransfer.effectAllowed = 'move';
        e.dataTransfer.setData('text/plain', id);
      }
    });

    el.addEventListener('dragend', ()=>{
      draggedCardId = null;

      el.classList.remove('dragging');

      handEl.querySelectorAll('.drag-over')
        .forEach(x=>x.classList.remove('drag-over'));
    });

    el.addEventListener('dragover', e=>{
      e.preventDefault();

      if(draggedCardId && draggedCardId !== id){
        el.classList.add('drag-over');

        if(e.dataTransfer){
          e.dataTransfer.dropEffect = 'move';
        }
      }
    });

    el.addEventListener('dragleave', ()=>{
      el.classList.remove('drag-over');
    });

    el.addEventListener('drop', e=>{
      e.preventDefault();

      el.classList.remove('drag-over');

      const fromId =
        draggedCardId ||
        e.dataTransfer?.getData('text/plain');

      const toId = id;

      if(!fromId || !toId || fromId === toId)return;

      const hand = handFromState();

      syncManualOrder(hand);

      const fromIndex = manualOrderIds.indexOf(fromId);
      const toIndex = manualOrderIds.indexOf(toId);

      if(fromIndex === -1 || toIndex === -1)return;

      manualOrderIds.splice(fromIndex,1);

      /*
       * Insert exactamente en la posición
       * de la carta sobre la que soltamos.
       */
      manualOrderIds.splice(toIndex,0,fromId);

      autoSort = false;

      renderGame();
    });
  });
}

function toggleAutoSort(){
  autoSort=!autoSort;

  if(!autoSort){
    syncManualOrder(handFromState());
  }

  renderGame();
}

function toggle(id){if(!state||state.current_player_id!==me)return;selected.has(id)?selected.delete(id):selected.add(id);renderGame()}
function ids(){return [...selected]}
function lower(){const a=ids();if(a.length<3||a.length>4)return setStatus('Selecciona 3 o 4 cartas.','error');send('lower_group',{card_ids:a});selected.clear()}
function takeDiscard(){const mine=state.players.find(p=>p.id===me);if(!state.last_discard)return;const a=ids();if(!a.includes(state.last_discard.id))a.push(state.last_discard.id);if(a.length<3||a.length>4)return setStatus('Selecciona 2 o 3 cartas de tu mano más el descarte.','error');send('take_discard',{card_ids:a});selected.clear()}
function discard(){const a=ids();if(a.length!==1)return setStatus('Selecciona exactamente una carta para descartar.','error');send('discard',{card_id:a[0]});selected.clear()}
function sendChat(){
 const input=$('chatInput'), text=input.value.trim();
 if(!text||!ws||ws.readyState!==1)return;
 ws.send(JSON.stringify({type:'chat',text}));
 input.value='';
}
$('chatInput')?.addEventListener('keydown',e=>{if(e.key==='Enter')sendChat()});
function requestRevenge(){
 if(ws&&ws.readyState===1)ws.send(JSON.stringify({type:'revenge'}));
}
function abandon(){
  intentionallyClosed=true;
  if(pingTimer){clearInterval(pingTimer);pingTimer=null}
  if(ws&&ws.readyState===1)ws.send(JSON.stringify({type:'abandon'}));
  location.href='/';
}
function esc(x){return String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
(async()=>{const q=new URLSearchParams(location.search);if(q.get('room')){$('roomCode').value=q.get('room').toUpperCase()}})();
</script></body></html>
