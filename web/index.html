<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Golpeado Online</title>
<style>
:root{--bg:#07130f;--table:#0b3b32;--table2:#082d27;--panel:#0d211c;--gold:#d9b45a;--gold2:#f0cf76;--text:#f7f3e8;--muted:#a8bbb4;--card:#fbf8ef;--ink:#151917;--red:#d51f2a;--red2:#ff3a43}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(circle at 50% -10%,#1d5b4c 0,#0d2b24 38%,var(--bg) 75%);color:var(--text);font:15px system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh}
.wrap{max-width:1400px;margin:auto;padding:18px}
.panel{background:rgba(9,31,25,.96);border:1px solid rgba(217,180,90,.35);border-radius:16px;padding:16px;box-shadow:0 14px 45px #0006}
.top{display:flex;justify-content:space-between;gap:12px;align-items:center}
.grid{display:grid;grid-template-columns:260px minmax(0,1fr) 285px;gap:14px}
.players{display:grid;gap:9px}
.player{padding:11px;border:1px solid #ffffff16;border-radius:12px;background:rgba(255,255,255,.018);transition:.2s ease}
.player.me{border-color:var(--gold)}
.player.active-turn{border:2px solid var(--red);box-shadow:0 0 16px rgba(213,31,42,.32),inset 0 0 20px rgba(213,31,42,.07);transform:translateX(2px)}
.player.active-turn .playerTurnTag{display:inline-block}
.playerTurnTag{display:none;background:var(--red);color:white;border-radius:999px;padding:2px 8px;font-size:10px;font-weight:900;margin-left:6px;letter-spacing:.3px}
.board{min-height:700px;background:linear-gradient(155deg,#155246,#0a332c 55%,#082b25);border-radius:18px;padding:18px;position:relative;overflow:hidden}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
button,input{font:inherit}
button{background:#16483e;color:var(--text);border:1px solid #ffffff20;border-radius:9px;padding:10px 13px;cursor:pointer;transition:transform .12s ease,box-shadow .12s ease,border-color .12s ease}
button:hover:not(:disabled){transform:translateY(-1px)}
button.primary{background:var(--gold);color:#17201d;font-weight:800}
button:disabled{opacity:.4;cursor:not-allowed}
input{width:100%;padding:10px;border-radius:9px;border:1px solid #ffffff25;background:#091512;color:var(--text);margin:5px 0 9px}
.status{color:var(--muted);min-height:24px}
.section{margin-top:16px}.center{text-align:center}.hidden{display:none}
.discard{display:inline-flex;vertical-align:middle}
.sort-active{border-color:var(--gold);box-shadow:0 0 0 2px #d6b45f33}
.error{color:#ff9a9a}.success{color:#9ce2b5}.title{font-size:28px;font-weight:900;color:var(--gold)}
small{color:var(--muted)}
.lobbyCount{font-size:14px;font-weight:800;margin:8px 0}
.turn-banner{margin:14px auto 12px;max-width:640px;text-align:center;border:2px solid var(--gold);border-radius:16px;background:rgba(5,24,19,.86);padding:11px 18px;box-shadow:0 8px 28px #0004}
.turn-banner.active{border-color:var(--red);box-shadow:0 0 24px rgba(213,31,42,.3);animation:turnPulse 1.8s ease-in-out infinite}
.turn-label{display:inline-block;background:var(--red);color:#fff;border-radius:999px;padding:4px 12px;font-size:11px;font-weight:900;letter-spacing:.7px}
.turn-name{font-size:24px;font-weight:900;margin-top:4px}
.turn-name strong{color:var(--red2)}
.turn-sub{color:var(--muted);font-size:13px;margin-top:2px}
@keyframes turnPulse{0%,100%{box-shadow:0 0 18px rgba(213,31,42,.22)}50%{box-shadow:0 0 30px rgba(213,31,42,.48)}}

.hand{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;padding:8px 2px 12px}
.card{position:relative;width:82px;height:116px;flex:0 0 auto;background:var(--card);color:var(--ink);border-radius:11px;border:2px solid #d5cdbd;box-shadow:0 5px 12px #0005;cursor:pointer;user-select:none;overflow:hidden;transition:transform .15s ease,box-shadow .15s ease,border-color .15s ease}
.card:hover{transform:translateY(-4px);box-shadow:0 10px 18px #0006}
.card.red{color:#c9222c}
.card.sel{border-color:var(--gold2);box-shadow:0 0 0 3px rgba(240,207,118,.38),0 12px 22px #0007;transform:translateY(-9px)}
.card-corner{position:absolute;left:7px;top:5px;display:flex;flex-direction:column;align-items:center;line-height:.9;font-weight:900}
.card-corner.bottom{left:auto;top:auto;right:7px;bottom:5px;transform:rotate(180deg)}
.card-rank{font-size:20px}.card-suit-small{font-size:17px;margin-top:2px}
.card-center{position:absolute;inset:26px 12px 26px;display:flex;align-items:center;justify-content:center}
.pips{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(5,1fr);width:100%;height:100%;align-items:center;justify-items:center;font-size:18px;line-height:1}
.pip{display:block}
.ace-pip{font-size:48px}
.face-card .face-frame{width:52px;height:62px;border:2px solid currentColor;border-radius:7px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(135deg,#f4e7b6,#fffdf7 45%,#e7c969)}
.face-card .face-letter{font-size:31px;font-weight:1000;line-height:1}
.face-card .face-suit{font-size:23px;line-height:1;margin-top:2px}
.card.back{display:flex;align-items:center;justify-content:center;background:#123f35;border-color:#d6b45f;color:#d6b45f}
.discard-slot{display:flex;justify-content:center;min-height:132px;margin:8px 0 2px}
.discard-slot .card{cursor:default}
.card-caption{font-size:12px;color:var(--muted);text-align:center;margin-top:3px}
.board-head{align-items:flex-start}
.board-head .meta{font-size:14px}
.board-head .meta b{color:var(--gold2)}
.hand-title{margin:0}
.hand-title-wrap{display:flex;justify-content:space-between;align-items:center;margin-top:12px}
.player-name{font-size:15px}
.stats{font-size:12px;color:var(--muted)}
@media(max-width:1100px){.grid{grid-template-columns:220px minmax(0,1fr)}.chatPanel{grid-column:1/-1}}
@media(max-width:760px){.grid{grid-template-columns:1fr}.board{min-height:0}.card{width:70px;height:100px}.hand{gap:7px}.turn-name{font-size:21px}}
.chatBox{height:360px;overflow:auto;display:grid;align-content:start;gap:8px;margin:10px 0}.chatMsg{padding:7px 9px;border:1px solid #28554a;border-radius:8px;background:#15332b}.chatInput{display:flex;gap:6px}.chatInput input{min-width:0;margin:0}.stats{font-size:12px;color:var(--muted)} .lobbyCount{font-size:14px;font-weight:800;margin:8px 0}
@media(max-width:1050px){.grid{grid-template-columns:210px minmax(0,1fr)}.chatPanel{grid-column:1/-1}}@media(max-width:700px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body><div class="wrap">
<div id="menu" class="panel"><div class="title">GOLPEADO</div><p><small>Juega online desde el navegador.</small></p>
<label>Tu nombre</label><input id="name" placeholder="Jugador" maxlength="24">
<div class="actions"><button class="primary" onclick="createRoom()">Crear sala</button></div>
<hr><label>Código de sala</label><input id="roomCode" placeholder="ABC123" maxlength="6">
<div class="actions"><button onclick="joinRoom()">Entrar a sala</button></div><div id="menuMsg" class="status"></div></div>
<div id="lobby" class="panel hidden"><div class="top"><div><div class="title">Sala <span id="lobbyCode"></span></div><div id="lobbyStatus" class="status"></div></div><button onclick="abandon()">Salir</button></div><div id="lobbyCount" class="lobbyCount">Jugadores en sala: 0/4</div><div id="lobbyPlayers" class="section"></div><div id="startControls" class="actions"></div></div>
<div id="game" class="hidden"><div class="top panel"><div><div class="title">GOLPEADO</div><div id="turnStatus" class="status"></div></div><button onclick="abandon()">Abandonar</button></div><div class="grid section"><aside class="panel"><h3>Jugadores</h3><div id="players" class="players"></div></aside><main class="board panel"><div id="turnBanner" class="turn-banner"><span class="turn-label">TURNO ACTUAL</span><div id="turnName" class="turn-name">Turno de —</div><div id="turnSub" class="turn-sub"></div></div><div class="top board-head"><div class="meta"><b>Mazo</b> <span id="deckCount"></span></div><div class="meta"><b>Último descarte</b></div></div><div id="discard" class="discard-slot"></div><div id="message" class="status section"></div><div id="actions" class="actions"></div><div class="hand-title-wrap"><h3 class="hand-title">Tu mano</h3><button id="sortBtn" onclick="toggleAutoSort()">↕ Ordenar</button></div><div id="hand" class="hand"></div></main><aside class="panel chatPanel"><div class="top"><h3 style="margin:0">Chat</h3><span id="chatCount" class="stats"></span></div><div id="chat" class="chatBox"></div><div class="chatInput"><input id="chatInput" maxlength="300" placeholder="Escribe un mensaje..."><button onclick="sendChat()">Enviar</button></div><div id="revenge" class="section"></div></aside></div></div>
</div>
<script>
let room=null, me=null, token=null, ws=null, state=null, selected=new Set(), actionSeq=0;
let autoSort=true, reconnectTimer=null, reconnectDelay=1000, pingTimer=null, intentionallyClosed=false;
const $=id=>document.getElementById(id); const msg=(t,c='')=>{ $('menuMsg').textContent=t; $('menuMsg').className='status '+c };
async function post(url,body){const r=await fetch(url,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.detail||d.message||'Error');return d}
async function createRoom(){try{const d=await post('/rooms',{name:$('name').value||'Jugador'});save(d);showLobby();}catch(e){msg(e.message,'error')}}
async function joinRoom(){try{const d=await post('/rooms/'+$('roomCode').value.trim().toUpperCase()+'/join',{name:$('name').value||'Jugador'});save(d);showLobby();}catch(e){msg(e.message,'error')}}
function save(d){room=d.room_code;me=d.player_id;token=d.reconnect_token;history.replaceState({},'',`/?room=${room}`);connect()}
function connect(){
  if(!room||!me||!token)return;
  intentionallyClosed=false;
  if(reconnectTimer){clearTimeout(reconnectTimer);reconnectTimer=null}
  if(ws&&ws.readyState<=1){try{ws.close()}catch(e){}}
  const scheme=location.protocol==='https:'?'wss://':'ws://';
  ws=new WebSocket(scheme+location.host+'/ws/'+room);
  ws.onopen=()=>{
    reconnectDelay=1000;
    ws.send(JSON.stringify({type:'hello',player_id:me,reconnect_token:token}));
    if(pingTimer)clearInterval(pingTimer);
    // Keep the free Render service from treating an otherwise active game as idle.
    pingTimer=setInterval(()=>{
      if(ws&&ws.readyState===WebSocket.OPEN)ws.send(JSON.stringify({type:'ping'}));
    },30000);
  };
  ws.onmessage=e=>{
    const m=JSON.parse(e.data);
    if(m.type==='pong')return;
    if(m.type==='state'||m.type==='action_ack'){render(m.state)}
    else if(m.type==='error')setStatus(m.message,'error')
  };
  ws.onerror=()=>{};
  ws.onclose=()=>{
    if(pingTimer){clearInterval(pingTimer);pingTimer=null}
    if(intentionallyClosed)return;
    setStatus('Conexión perdida. Intentando reconectar…','error');
    clearTimeout(reconnectTimer);
    reconnectTimer=setTimeout(connect,reconnectDelay);
    reconnectDelay=Math.min(reconnectDelay*2,10000);
  };
}
function send(action,payload={}){if(!ws||ws.readyState!==1)return;ws.send(JSON.stringify({type:'action',action_id:`${Date.now()}-${++actionSeq}`,action,payload}))}
async function start(){try{await post('/rooms/'+room+'/start',{player_id:me,bot_count:0,bot_difficulty:'normal'})}catch(e){setStatus(e.message,'error')}}
function showLobby(){$('menu').classList.add('hidden');$('lobby').classList.remove('hidden');$('lobbyCode').textContent=room;}
function setStatus(t,c=''){$('message').textContent=t;$('message').className='status '+c;$('lobbyStatus').textContent=t}
function render(s){state=s;if(s.game_state){$('lobby').classList.add('hidden');$('game').classList.remove('hidden');renderGame()}else{showLobby();renderLobby()}}
function renderLobby(){
  const ps=state?.players||[];
  $('lobbyCount').textContent=`Jugadores en sala: ${ps.length}/4`;
  $('lobbyPlayers').innerHTML=ps.map(p=>`<div class="player ${p.id===me?'me':''}"><b>${esc(p.name)}</b> ${p.id===me?'(tú)':''}</div>`).join('');
  const isHost=state?.host_id===me || ps[0]?.id===me;
  if(isHost){
    $('startControls').innerHTML=ps.length>=2
      ? `<button class="primary" onclick="start()">▶ Iniciar partida (${ps.length}/4)</button>`
      : `<button class="primary" disabled>▶ Iniciar partida (${ps.length}/4)</button><small>Se necesitan al menos 2 jugadores.</small>`;
  }else{
    $('startControls').innerHTML=`<small>Jugadores en sala: <b>${ps.length}/4</b>. ${ps.length>=2?'Esperando al anfitrión para iniciar…':'Esperando más jugadores…'}<br>Comparte el código <b>${room}</b>.</small>`;
  }
}
function renderGame(){
 const ps=state.players||[];
 const activePlayer=ps.find(p=>p.id===state.current_player_id);
 const activeName=activePlayer?.name||'—';
 const myTurn=state.current_player_id===me && state.game_state==='playing';
 const won=state.game_state==='WON'||state.game_state==='won';
 $('turnStatus').textContent=won
   ? `Partida terminada · ganó ${state.winner?.reason||activeName||''}`
   : (myTurn?'Es tu turno.':'Turno de otro jugador.');
 $('turnName').innerHTML=`Turno de <strong>${esc(activeName)}</strong>`;
 $('turnSub').textContent=won?'Partida terminada.':(myTurn?'¡ES TU TURNO! Juega ahora.':'Espera a que termine su turno.');
 $('turnBanner').className=`turn-banner ${myTurn?'active':''}`;
 $('deckCount').textContent=state.deck_count;
 $('discard').innerHTML=cardHtml(state.last_discard,true);

 $('players').innerHTML=ps.map(p=>{
   const st=state.stats?.[p.id]||{wins:0,losses:0};
   const active=p.id===state.current_player_id && state.game_state==='playing';
   return `<div class="player ${p.id===me?'me ':''}${active?'active-turn':''}">
     <div class="player-name"><b>${esc(p.name)}</b>${p.id===me?' <small>(tú)</small>':''}${active?'<span class="playerTurnTag">SU TURNO</span>':''}</div>
     <small>${p.active?'Activo':'Fuera'} · ${p.card_count} cartas · ${p.connected?'Conectado':'Desconectado'}</small><br>
     <span class="stats">🏆 ${st.wins} · ❌ ${st.losses}</span>
     ${p.lowered_group?`<br><small>Grupo: ${p.lowered_group.cards.map(c=>displayRank(c.rank)+c.symbol).join(' ')}</small>`:''}
   </div>`;
 }).join('');

 const mine=ps.find(p=>p.id===me);
 const hand=autoSort?sortHand(mine?.hand||[]):(mine?.hand||[]);
 $('hand').innerHTML=hand.map(c=>cardHtml(c,false)).join('');
 $('sortBtn').className=autoSort?'sort-active':'';
 $('sortBtn').textContent=autoSort?'↕ Orden automático':'↕ Ordenar';

 $('actions').innerHTML='';
 if(myTurn){
   if(state.phase==='draw') $('actions').innerHTML='<button class="primary" onclick="send(\'draw\')">Robar del mazo</button>'+(state.last_discard?'<button onclick="takeDiscard()">Recoger descarte</button>':'');
   if(state.phase==='action'||state.phase==='discard'){
     if(state.phase==='action'&&mine?.lowered_group===null) $('actions').innerHTML+='<button onclick="lower()">Bajar grupo seleccionado</button>';
     $('actions').innerHTML+='<button class="primary" onclick="discard()">Descartar seleccionada</button>';
   }
 }

 const chat=state.chat||[];
 $('chat').innerHTML=chat.map(m=>`<div class="chatMsg"><b>${esc(m.name)}</b><br>${esc(m.text)}</div>`).join('');
 $('chatCount').textContent=chat.length?`${chat.length} mensajes`:'';
 $('chat').scrollTop=$('chat').scrollHeight;

 const active=ps.filter(p=>p.active);
 if(won){
   const voted=(state.revenge_votes||[]).includes(me);
   $('revenge').innerHTML=`<div class="status success"><b>Revancha</b><br>${(state.revenge_votes||[]).length}/${active.length} aceptaron.</div><button onclick="requestRevenge()" ${voted?'disabled':''}>${voted?'✓ Esperando a los demás':'🔄 Aceptar revancha'}</button>`;
 } else $('revenge').innerHTML='';
}
function displayRank(rank){
 const r=String(rank||'').toUpperCase();
 return ({ACE:'A',TWO:'2',THREE:'3',FOUR:'4',FIVE:'5',SIX:'6',SEVEN:'7',EIGHT:'8',NINE:'9',TEN:'10',JACK:'J',QUEEN:'Q',KING:'K',AS:'A',A:'A',J:'J',Q:'Q',K:'K'})[r]||r;
}
function suitSymbol(c){
 return c?.symbol || ({CLUBS:'♣',DIAMONDS:'♦',HEARTS:'♥',SPADES:'♠',C:'♣',D:'♦',H:'♥',S:'♠'})[String(c?.suit||'').toUpperCase()] || '';
}
function pipCount(rank){
 const n=Number(rank);
 if(Number.isFinite(n)&&n>=2&&n<=10)return n;
 const r=String(rank||'').toUpperCase();
 return ({TWO:2,THREE:3,FOUR:4,FIVE:5,SIX:6,SEVEN:7,EIGHT:8,NINE:9,TEN:10})[r]||0;
}
function pipPositions(n){
 const map={
  2:[[1,1],[3,5]],3:[[1,1],[2,3],[3,5]],
  4:[[1,1],[3,1],[1,5],[3,5]],
  5:[[1,1],[3,1],[2,3],[1,5],[3,5]],
  6:[[1,1],[3,1],[1,3],[3,3],[1,5],[3,5]],
  7:[[1,1],[3,1],[2,2],[1,3],[3,3],[1,5],[3,5]],
  8:[[1,1],[3,1],[2,2],[1,3],[3,3],[2,4],[1,5],[3,5]],
  9:[[1,1],[3,1],[1,2],[3,2],[2,3],[1,4],[3,4],[1,5],[3,5]],
  10:[[1,1],[3,1],[2,2],[1,3],[3,3],[2,4],[1,5],[3,5],[1,4],[3,4]]
 };
 return map[n]||[];
}
function cardHtml(c,small){
 if(!c)return '<div class="card-caption">—</div>';
 const red=['HEARTS','DIAMONDS','H','D'].includes(String(c.suit||'').toUpperCase());
 const rank=displayRank(c.rank), suit=suitSymbol(c), n=pipCount(c.rank);
 const face=['J','Q','K'].includes(rank);
 let center='';
 if(face) center=`<div class="card-center face-card"><div class="face-frame"><span class="face-letter">${rank}</span><span class="face-suit">${suit}</span></div></div>`;
 else if(rank==='A') center=`<div class="card-center"><span class="ace-pip">${suit}</span></div>`;
 else {
   const pos=pipPositions(n);
   const pips=pos.map(([col,row])=>`<span class="pip" style="grid-column:${col};grid-row:${row}">${suit}</span>`).join('');
   center=`<div class="card-center"><div class="pips">${pips}</div></div>`;
 }
 const click=small?'':` onclick="toggle('${esc(c.id)}')"`;
 return `<div class="card ${small?'discard-card ':''}${red?'red ':''}${selected.has(c.id)?'sel':''}"${click}>
   <div class="card-corner"><span class="card-rank">${esc(rank)}</span><span class="card-suit-small">${esc(suit)}</span></div>
   ${center}
   <div class="card-corner bottom"><span class="card-rank">${esc(rank)}</span><span class="card-suit-small">${esc(suit)}</span></div>
 </div>`;
}
function sortHand(hand){
  const rankOrder={
    ACE:1,AS:1,A:1,
    TWO:2,
    THREE:3,
    FOUR:4,
    FIVE:5,
    SIX:6,
    SEVEN:7,
    EIGHT:8,
    NINE:9,
    TEN:10,
    JACK:11,J:11,
    QUEEN:12,Q:12,
    KING:13,K:13
  };

  const suitOrder={
    CLUBS:1,C:1,
    DIAMONDS:2,D:2,
    HEARTS:3,H:3,
    SPADES:4,S:4
  };

  return [...hand].sort((a,b)=>{
    const ar=rankOrder[String(a.rank||'').toUpperCase()]??99;
    const br=rankOrder[String(b.rank||'').toUpperCase()]??99;

    if(ar!==br)return ar-br;

    const as=suitOrder[String(a.suit||'').toUpperCase()]??99;
    const bs=suitOrder[String(b.suit||'').toUpperCase()]??99;

    return as-bs;
  });
}

function toggleAutoSort(){
  autoSort=!autoSort;
  renderGame();
}

function toggle(id){if(!state||state.current_player_id!==me)return;selected.has(id)?selected.delete(id):selected.add(id);renderGame()}
function ids(){return [...selected]}
function lower(){const a=ids();if(a.length<3||a.length>4)return setStatus('Selecciona 3 o 4 cartas.','error');send('lower_group',{card_ids:a});selected.clear()}
function takeDiscard(){const mine=state.players.find(p=>p.id===me);if(!state.last_discard)return;const a=ids();if(!a.includes(state.last_discard.id))a.push(state.last_discard.id);if(a.length<3||a.length>4)return setStatus('Selecciona 2 o 3 cartas de tu mano más el descarte.','error');send('take_discard',{card_ids:a});selected.clear()}
function discard(){const a=ids();if(a.length!==1)return setStatus('Selecciona exactamente una carta para descartar.','error');send('discard',{card_id:a[0]});selected.clear()}
function sendChat(){
 const input=$('chatInput'), text=input.value.trim();
 if(!text||!ws||ws.readyState!==1)return;
 ws.send(JSON.stringify({type:'chat',text}));
 input.value='';
}
$('chatInput')?.addEventListener('keydown',e=>{if(e.key==='Enter')sendChat()});
function requestRevenge(){
 if(ws&&ws.readyState===1)ws.send(JSON.stringify({type:'revenge'}));
}
function abandon(){
  intentionallyClosed=true;
  if(pingTimer){clearInterval(pingTimer);pingTimer=null}
  if(ws&&ws.readyState===1)ws.send(JSON.stringify({type:'abandon'}));
  location.href='/';
}
function esc(x){return String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
(async()=>{const q=new URLSearchParams(location.search);if(q.get('room')){$('roomCode').value=q.get('room').toUpperCase()}})();
</script></body></html>
